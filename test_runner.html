<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="synth"></div>
<div id="app"></div>
<pre id="err"></pre>
<script>
window.onerror = function(msg, url, line, col, err) {
  document.getElementById('err').textContent += 'ERROR: ' + msg + ' at ' + url + ':' + line + ':' + col + '\n' + (err ? err.stack : '');
  console.error(msg, url, line, err);
};
</script>
<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/state.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/shell.js"></script>
<script>
if (!document.getElementById('err').textContent) {
  document.getElementById('err').textContent = 'SUCCESS: rendered without error. DOM length: ' + document.getElementById('app').innerHTML.length;
}
</script>
</body>
</html>
