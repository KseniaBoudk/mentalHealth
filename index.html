<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurvan</title>
<!-- GitHub Pages serves index.html at the repo's Pages root; the actual
     app lives at kurvan.html (see CLAUDE.md — no build step, kurvan.html
     is meant to be opened directly). This is a redirect stub, nothing
     more: the meta refresh below is a no-JS/no-JS-yet fallback that lands
     on kurvan.html with no query string; the script tag is the real path
     and preserves ?query/#hash so a shared/bookmarked link (Kurvan's own
     URL-state feature, js/shell.js's stateFromUrl()/syncUrlFromState())
     still restores the exact view it pointed at, not just the bare page. -->
<meta http-equiv="refresh" content="0; url=kurvan.html">
<script>location.replace("kurvan.html" + location.search + location.hash);</script>
</head>
<body>
<p>Kurvan har flyttat hit / Kurvan has moved here: <a href="kurvan.html">kurvan.html</a></p>
</body>
</html>
